name: Flow reminder check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check due reminders
        run: |
          curl -s -X POST "$ENDPOINT" -H "Authorization: Bearer $CRON_SECRET"
        env:
          ENDPOINT: ${{ secrets.NOTIFY_ENDPOINT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Flow</title>
<meta name="theme-color" content="#0F1117" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

  [data-theme="dark"] {
    --bg:#0F1117; --text:#E7E9EE; --muted:#8B90A0; --dim:#5B6072;
    --card-1:#1C2030; --card-2:#14161F;
    --hairline: rgba(255,255,255,0.06); --hairline-strong: rgba(255,255,255,0.1);
    --surface-1: rgba(255,255,255,0.07); --surface-2: rgba(255,255,255,0.015);
    --shadow: rgba(0,0,0,0.6);
    --glow1: rgba(79,70,229,0.38); --glow2: rgba(45,212,191,0.20);
    --brand-1:#F4F5F7; --brand-2:#A5B4FC;
    --ring-track:#1E212B; --tile-empty:#1A1D29; --input-bg:#20232F; --check-border:#3A3F4E;
  }
  [data-theme="light"] {
    --bg:#F1F2F7; --text:#14151C; --muted:#5B5F6B; --dim:#9497A3;
    --card-1:#FFFFFF; --card-2:#F1F2F7;
    --hairline: rgba(15,17,23,0.07); --hairline-strong: rgba(15,17,23,0.12);
    --surface-1: rgba(15,17,23,0.035); --surface-2: rgba(15,17,23,0.008);
    --shadow: rgba(30,35,60,0.16);
    --glow1: rgba(79,70,229,0.16); --glow2: rgba(45,212,191,0.14);
    --brand-1:#14151C; --brand-2:#4F46E5;
    --ring-track:#E3E6ED; --tile-empty:#EAECF1; --input-bg:#EAECF1; --check-border:#C7CBD3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin:0; color:var(--text); font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    min-height:100vh;
    background:
      radial-gradient(650px circle at 15% -10%, var(--glow1), transparent 60%),
      radial-gradient(500px circle at 105% 5%, var(--glow2), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    transition: background-color .3s ease, color .3s ease;
  }
  .mono { font-family:'JetBrains Mono', ui-monospace, monospace; }
  input::placeholder { color: var(--dim); }
  ::-webkit-scrollbar { height:0; width:0; }
  button { -webkit-tap-highlight-color: transparent; font-family:inherit; }

  .wrap { max-width:480px; margin:0 auto; padding:26px 16px 64px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; gap:8px; }
  .brand { display:flex; align-items:center; gap:9px; }
  .brand-bar { width:5px; height:22px; background:var(--indigo,#4F46E5); border-radius:3px; box-shadow:0 0 14px rgba(79,70,229,0.65); }
  .brand-name {
    font-weight:800; font-size:21px; letter-spacing:-0.03em;
    background:linear-gradient(90deg,var(--brand-1) 0%,var(--brand-2) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .stats { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); }
  .stat-pill { background:var(--surface-1); border:1px solid var(--hairline-strong); padding:6px 11px; border-radius:999px; }
  .bell, .theme-btn { display:flex; align-items:center; gap:6px; cursor:pointer; background:var(--surface-1);
    border:1px solid var(--hairline-strong); color:var(--muted); font-size:13px; padding:6px 11px; border-radius:999px; }
  .bell.on { background:rgba(79,70,229,0.22); border-color:#4F46E5; color:#C7D2FE; }

  .quickadd-wrap { margin-bottom:16px; }
  .quickadd {
    background:linear-gradient(160deg,var(--card-1) 0%,var(--card-2) 100%);
    border:1px solid var(--hairline-strong); border-radius:20px; padding:12px 14px;
    display:flex; align-items:center; gap:12px;
    box-shadow:0 10px 30px -16px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.04);
    transition: border-color .2s, box-shadow .2s;
  }
  .quickadd:focus-within { border-color:#4F46E5; box-shadow:0 0 0 3px rgba(79,70,229,0.18); }
  .quickadd input { flex:1; background:transparent; border:none; outline:none; color:var(--text); font-size:14.5px; font-family:inherit; min-width:0; }
  .qa-plus {
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg,#6366F1,#4F46E5); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:16px;
    box-shadow:0 4px 14px -4px rgba(79,70,229,0.8);
  }
  .live-tag { font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap; flex-shrink:0; animation:pop .22s ease; }
  @keyframes pop { from{opacity:0;transform:scale(.85);} to{opacity:1;transform:scale(1);} }
  .hint { font-size:11px; color:var(--dim); margin:9px 3px 0; }

  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chip {
    font-size:12px; font-weight:700; padding:7px 13px; border-radius:999px; border:1px solid var(--hairline-strong);
    color:var(--muted); white-space:nowrap; background:var(--surface-1); font-family:inherit;
    display:flex; align-items:center; gap:6px; cursor:pointer;
  }

  .card {
    background:linear-gradient(160deg,var(--card-1) 0%,var(--card-2) 100%);
    border:1px solid var(--hairline); border-radius:24px; padding:18px; margin-bottom:16px;
    box-shadow:0 10px 32px -16px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .eyebrow { font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted);
    display:flex; align-items:center; gap:6px; margin-bottom:12px; }

  .check { width:22px; height:22px; border-radius:50%; flex-shrink:0; border:1.5px solid var(--check-border);
    background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff; font-size:11px; padding:0; }
  .check.done { background:#4F46E5; border-color:#4F46E5; box-shadow:0 0 10px rgba(79,70,229,0.55); }
  @keyframes checkPop { 0%{transform:scale(.55);} 55%{transform:scale(1.18);} 100%{transform:scale(1);} }
  @keyframes ringPulse { 0%{box-shadow:0 0 0 0 rgba(79,70,229,0.55);} 100%{box-shadow:0 0 0 12px rgba(79,70,229,0);} }
  .check.just-completed { animation: checkPop .38s cubic-bezier(.34,1.56,.64,1), ringPulse .55s ease-out; }

  .group-label { font-size:11px; text-transform:uppercase; letter-spacing:0.08em; display:flex; align-items:center;
    gap:7px; margin:14px 0 5px; }
  .group-label:first-child { margin-top:0; }
  .group-label .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }

  .tile-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .tile {
    aspect-ratio:1; border-radius:20px; padding:13px; position:relative;
    display:flex; flex-direction:column; justify-content:space-between;
    background:linear-gradient(160deg,var(--card-1),var(--card-2));
    border:1px solid var(--hairline); box-shadow:0 6px 20px -12px var(--shadow);
  }
  .tile-top { display:flex; align-items:center; justify-content:space-between; gap:4px; }
  .tile-cat-label { font-size:9.5px; font-weight:700; letter-spacing:.05em; background:none; border:none; padding:0; cursor:pointer; }
  .tile-del { background:none; border:none; color:var(--dim); font-size:11px; padding:2px; cursor:pointer; }
  .tile-text { font-size:12.5px; line-height:1.35; color:var(--text); margin:8px 0;
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .tile-text.done { color:var(--dim); text-decoration:line-through; }
  .tile-footer { display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .tile-due { font-size:9px; font-weight:700; padding:4px 7px; border-radius:999px; border:none; white-space:nowrap;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .tile-note-meta { font-size:9.5px; color:var(--dim); }

  .streak-row { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
  .streak-bar { width:12px; height:34px; border-radius:8px; flex-shrink:0; background:var(--tile-empty); }

  .health-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--hairline); }
  .health-row:last-child { border-bottom:none; }
  .health-label { display:flex; align-items:center; gap:8px; font-size:14px; }

  .cutout-row { display:flex; gap:10px; margin-top:16px; }
  .cutout-btn {
    display:flex; flex-direction:column; align-items:center; gap:6px; flex:1;
    background:linear-gradient(160deg, var(--surface-1), var(--surface-2));
    border:1px solid var(--hairline-strong); border-radius:18px; padding:12px 6px;
    cursor:pointer; transition:transform .1s;
  }
  .cutout-btn:active { transform:scale(0.94); }
  .cutout-label { font-size:11px; font-weight:700; color:var(--text); }
  .cutout-sub { font-size:10px; color:var(--dim); }

  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-nav { background:var(--surface-1); border:1px solid var(--hairline-strong); color:var(--muted); font-size:15px; cursor:pointer; padding:5px 11px; border-radius:10px; }
  .cal-month { font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-dow { text-align:center; font-size:11px; color:var(--dim); }
  .cal-day { aspect-ratio:1; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:12px;
    border:1px solid transparent; background:var(--tile-empty); color:var(--dim); cursor:pointer; }
  .cal-day.today { border-color:var(--text); }
  .cal-day.future { opacity:0.3; pointer-events:none; }

  .select-tag, .due-input { font-size:11px; border-radius:999px; padding:4px 8px; background:var(--input-bg); color:var(--text);
    border:1px solid var(--hairline-strong); font-family:inherit; }

  .note-edit-area { width:100%; min-height:64px; background:transparent; border:none; outline:none; resize:vertical;
    font-family:inherit; font-size:13px; line-height:1.4; color:var(--text); }
  .note-tile { aspect-ratio:auto; min-height:150px; }
  .note-tap { cursor:pointer; }

  .row-item { display:flex; align-items:flex-start; gap:10px; padding:12px 0; border-bottom:1px solid var(--hairline); }
  .row-item:last-child { border-bottom:none; }
  .row-body { flex:1; min-width:0; }
  .row-text { font-size:13.5px; margin:0 0 6px; color:var(--text); }
  .row-text.done { color:var(--dim); text-decoration:line-through; }
  .tag { font-size:11px; font-weight:600; padding:4px 9px; border-radius:999px; border:none; font-family:inherit;
    cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
  .tag-row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }

  .empty { font-size:13px; color:var(--dim); text-align:center; padding:20px 0; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  var STORAGE_TASKS = "flow-tasks-v1";
  var STORAGE_HEALTH = "flow-health-v1";
  var STORAGE_NOTIF = "flow-notif-v1";
  var STORAGE_THEME = "flow-theme-v1";
  var STORAGE_GEO = "flow-geo-v1";
  var WATER_GOAL_ML = 3000;
  var CAFFEINE_MG_PER_ML = 95 / 240;
  var VAPID_PUBLIC_KEY = "BGY-SgdY5MSwdE32mnMAtuJbQh7ClMXS3xs1RRzHHJcUAtylb-6L2iTm5RuOZ_1JOnkb27kyoZCt2DkjRAd_SeI";
  var API_BASE = "https://flow-app-snowy.vercel.app";

  var CATEGORIES = [
    { id: "work", name: "Happiness Entertainment", short: "Work", color: "#F0B429",
      keywords: ["hotel","animator","animation","jaz","baron","true beach","sharm","marsa alam","shift","staff","guest experience","review platform","tripadvisor","entertainment team","stage","contract","training session","event"] },
    { id: "vonarson", name: "Vonarson / GuestPulse", short: "Vonarson", color: "#8B7CF6",
      keywords: ["guestpulse","vonarson","saas","pricing page","landing page","investor","pitch deck","roadmap","nfc","qr code","onboarding flow","demo","mvp","no-code","subscriber","churn","prospect"] },
    { id: "home", name: "Home", short: "Home", color: "#F472B6",
      keywords: ["buy","home","apartment","furniture","paint","kitchen","curtain","plant","clean","repair","grocery","fix the","decor","living room"] },
    { id: "books", name: "Books to Read", short: "Books", color: "#34D399",
      keywords: ["book","read","novel","author","chapter","audiobook"] },
    { id: "health", name: "Health", short: "Health", color: "#2DD4BF",
      keywords: ["gym","workout","supplement","vitamin","doctor","appointment","protein","health","checkup","dentist"] },
    { id: "notes", name: "Notes", short: "Notes", color: "#60A5FA",
      keywords: ["note","idea","thought"] },
    { id: "inbox", name: "Inbox", short: "Inbox", color: "#8B90A0", keywords: [] }
  ];
  var CAT_BY_ID = {};
  CATEGORIES.forEach(function (c) { CAT_BY_ID[c.id] = c; });
  var STATUS = { red: "#F87171", amber: "#F59E0B", green: "#34D399" };

  function categorize(text) {
    var t = text.toLowerCase();
    for (var i = 0; i < CATEGORIES.length; i++) {
      var cat = CATEGORIES[i];
      if (cat.id === "inbox") continue;
      for (var j = 0; j < cat.keywords.length; j++) {
        if (t.indexOf(cat.keywords[j]) !== -1) return cat.id;
      }
    }
    return "inbox";
  }

  function makeId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now() + "-" + Math.random().toString(36).slice(2);
  }
  function pad(n) { return String(n).padStart(2, "0"); }
  function fmtKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function toLocalInput(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function seedTasks() {
    var now = new Date();
    var tomorrow6pm = new Date(now); tomorrow6pm.setDate(now.getDate() + 1); tomorrow6pm.setHours(18, 0, 0, 0);
    var in2h = new Date(now.getTime() + 2 * 60 * 60 * 1000);
    return [
      { id: makeId(), text: "Confirm animator shift schedule for Jaz Sharm", categoryId: "work", dueDate: toLocalInput(tomorrow6pm), done: false, createdAt: Date.now() - 6000 },
      { id: makeId(), text: "Review GuestPulse pricing page copy", categoryId: "vonarson", dueDate: toLocalInput(in2h), done: false, createdAt: Date.now() - 5000 },
      { id: makeId(), text: "Buy new curtains for the living room", categoryId: "home", dueDate: null, done: false, createdAt: Date.now() - 4000 },
      { id: makeId(), text: "Start reading Atomic Habits", categoryId: "books", dueDate: null, done: false, createdAt: Date.now() - 3000 },
      { id: makeId(), text: "Order more vitamin D drops", categoryId: "health", dueDate: null, done: false, createdAt: Date.now() - 2000 },
      { id: makeId(), text: "Idea: offer a bundled audio + animation package to Tier 2 resorts", categoryId: "notes", dueDate: null, done: false, createdAt: Date.now() - 1000 }
    ];
  }
  function seedHealth() {
    var now = new Date();
    var y1 = new Date(now); y1.setDate(now.getDate() - 1);
    var y2 = new Date(now); y2.setDate(now.getDate() - 2);
    var y3 = new Date(now); y3.setDate(now.getDate() - 3);
    var out = {};
    out[fmtKey(y1)] = { eat: true, waterMl: 3000, caffeineMl: 240, supplements: true, gym: true };
    out[fmtKey(y2)] = { eat: true, waterMl: 1800, caffeineMl: 0, supplements: false, gym: false };
    out[fmtKey(y3)] = { eat: false, waterMl: 0, caffeineMl: 0, supplements: false, gym: false };
    return out;
  }

  function load(key) {
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

  var tasks = load(STORAGE_TASKS);
  if (!tasks) { tasks = seedTasks(); save(STORAGE_TASKS, tasks); }
  var healthLogs = load(STORAGE_HEALTH);
  if (!healthLogs) { healthLogs = seedHealth(); save(STORAGE_HEALTH, healthLogs); }
  var storedNotif = load(STORAGE_NOTIF);

  var state = {
    filter: "all",
    inputValue: "",
    editState: { type: null, id: null },
    notifEnabled: storedNotif === true && ("Notification" in window) && Notification.permission === "granted",
    notifiedIds: {},
    calendarMonth: (function () { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })(),
    editingHealthDate: null,
    themeMode: load(STORAGE_THEME) || "auto",
    justCompletedId: null,
    editingNoteId: null
  };

  function persistTasks() { save(STORAGE_TASKS, tasks); syncTasksToServer(); }
  function persistHealth() { save(STORAGE_HEALTH, healthLogs); }

  // ---------- Sunrise / sunset (NOAA solar position equations) ----------
  function computeSunTimes(date, lat, lon) {
    var rad = Math.PI / 180;
    var dayStartUTC = Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate());
    var yearStartUTC = Date.UTC(date.getUTCFullYear(), 0, 1);
    var dayOfYear = Math.floor((dayStartUTC - yearStartUTC) / 86400000) + 1;
    var fracYear = (2 * Math.PI / 365) * (dayOfYear - 1);
    var eqTime = 229.18 * (0.000075 + 0.001868 * Math.cos(fracYear) - 0.032077 * Math.sin(fracYear)
      - 0.014615 * Math.cos(2 * fracYear) - 0.040849 * Math.sin(2 * fracYear));
    var decl = 0.006918 - 0.399912 * Math.cos(fracYear) + 0.070257 * Math.sin(fracYear)
      - 0.006758 * Math.cos(2 * fracYear) + 0.000907 * Math.sin(2 * fracYear)
      - 0.002697 * Math.cos(3 * fracYear) + 0.00148 * Math.sin(3 * fracYear);
    var zenith = 90.833 * rad;
    var latRad = lat * rad;
    var cosH = (Math.cos(zenith) / (Math.cos(latRad) * Math.cos(decl))) - Math.tan(latRad) * Math.tan(decl);
    if (cosH > 1) return { polarNight: true };
    if (cosH < -1) return { polarDay: true };
    var haDeg = Math.acos(cosH) / rad;
    var sunriseUTCmin = 720 - 4 * (lon + haDeg) - eqTime;
    var sunsetUTCmin = 720 - 4 * (lon - haDeg) - eqTime;
    return {
      sunrise: new Date(dayStartUTC + sunriseUTCmin * 60000),
      sunset: new Date(dayStartUTC + sunsetUTCmin * 60000)
    };
  }

  function requestGeo() {
    if (!("geolocation" in navigator)) return;
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        save(STORAGE_GEO, { lat: pos.coords.latitude, lon: pos.coords.longitude, ts: Date.now() });
        applyTheme(); render();
      },
      function () {},
      { timeout: 8000 }
    );
  }

  function resolveEffectiveTheme() {
    if (state.themeMode === "light") return "light";
    if (state.themeMode === "dark") return "dark";
    var geo = load(STORAGE_GEO);
    if (!geo) return "dark";
    var sun = computeSunTimes(new Date(), geo.lat, geo.lon);
    if (!sun || sun.polarNight) return "dark";
    if (sun.polarDay) return "light";
    var now = new Date();
    return (now >= sun.sunrise && now < sun.sunset) ? "light" : "dark";
  }

  function applyTheme() {
    document.documentElement.setAttribute("data-theme", resolveEffectiveTheme());
    var metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme) metaTheme.setAttribute("content", resolveEffectiveTheme() === "light" ? "#F1F2F7" : "#0F1117");
  }

  function cycleTheme() {
    var order = ["auto", "light", "dark"];
    var idx = order.indexOf(state.themeMode);
    state.themeMode = order[(idx + 1) % order.length];
    save(STORAGE_THEME, state.themeMode);
    if (state.themeMode === "auto" && !load(STORAGE_GEO)) requestGeo();
    applyTheme();
    render();
  }

  applyTheme();
  if (state.themeMode === "auto" && !load(STORAGE_GEO)) requestGeo();
  setInterval(applyTheme, 5 * 60 * 1000);

  function scoreOf(log) {
    if (!log) return null;
    var n = 0;
    if (log.eat) n++;
    if ((log.waterMl || 0) >= WATER_GOAL_ML) n++;
    if (log.supplements) n++;
    if (log.gym) n++;
    return n;
  }
  function statusHex(score) {
    if (score === null || score === undefined) return null;
    if (score === 0) return STATUS.red;
    if (score <= 2) return STATUS.amber;
    return STATUS.green;
  }
  function getHealthLog(key) {
    return healthLogs[key] || { eat: false, waterMl: 0, caffeineMl: 0, supplements: false, gym: false };
  }

  function dueMeta(dueStr) {
    var d = new Date(dueStr), now = new Date();
    var overdue = d < now;
    var sameDay = d.toDateString() === now.toDateString();
    var tmr = new Date(now); tmr.setDate(now.getDate() + 1);
    var isTomorrow = d.toDateString() === tmr.toDateString();
    var time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    var label;
    if (sameDay) label = "Today · " + time;
    else if (isTomorrow) label = "Tomorrow · " + time;
    else label = d.toLocaleDateString([], { month: "short", day: "numeric" }) + " · " + time;
    return { overdue: overdue, label: label };
  }
  function endOfToday() { var d = new Date(); d.setHours(23, 59, 59, 999); return d; }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }

  function iconBottleSmall(idSuffix) {
    var gid = "waterGradS" + idSuffix;
    return '<svg width="38" height="60" viewBox="0 0 60 96" fill="none">' +
      '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0%" stop-color="#67E8F9"/><stop offset="100%" stop-color="#3B82F6"/>' +
      '</linearGradient></defs>' +
      '<rect x="22" y="2" width="16" height="10" rx="3" fill="#CBD5E1"/>' +
      '<rect x="24" y="10" width="12" height="10" fill="url(#' + gid + ')"/>' +
      '<rect x="10" y="20" width="40" height="74" rx="14" fill="url(#' + gid + ')"/>' +
      '<rect x="10" y="52" width="40" height="16" fill="rgba(15,17,23,0.18)"/>' +
      '<rect x="17" y="30" width="6" height="50" rx="3" fill="rgba(255,255,255,0.35)"/>' +
      '</svg>';
  }
  function iconBottleBig(idSuffix) {
    var gid = "waterGradB" + idSuffix;
    return '<svg width="48" height="68" viewBox="0 0 76 104" fill="none">' +
      '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#4F46E5"/>' +
      '</linearGradient></defs>' +
      '<rect x="28" y="2" width="20" height="10" rx="3" fill="#CBD5E1"/>' +
      '<rect x="30" y="10" width="16" height="12" fill="url(#' + gid + ')"/>' +
      '<path d="M14 26 Q14 22 20 22 L56 22 Q62 22 62 26 L66 92 Q66 102 56 102 L20 102 Q10 102 10 92 Z" fill="url(#' + gid + ')"/>' +
      '<rect x="10" y="58" width="56" height="18" fill="rgba(15,17,23,0.18)"/>' +
      '<rect x="20" y="34" width="7" height="56" rx="3.5" fill="rgba(255,255,255,0.32)"/>' +
      '</svg>';
  }
  function iconCoffeeCup(idSuffix) {
    var gid = "coffeeGrad" + idSuffix;
    return '<svg width="52" height="52" viewBox="0 0 100 96" fill="none">' +
      '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#D8A868"/><stop offset="100%" stop-color="#8B5E34"/>' +
      '</linearGradient></defs>' +
      '<path d="M18 26 L82 26 L74 84 Q73 92 62 92 L38 92 Q27 92 26 84 Z" fill="url(#' + gid + ')"/>' +
      '<path d="M80 34 Q102 36 98 54 Q94 72 76 68" stroke="url(#' + gid + ')" stroke-width="8" fill="none" stroke-linecap="round"/>' +
      '<ellipse cx="50" cy="27" rx="30" ry="7" fill="#5C3A22"/>' +
      '<path d="M40 16 Q34 8 40 -2" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none" stroke-linecap="round"/>' +
      '<path d="M56 16 Q50 8 56 -2" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none" stroke-linecap="round"/>' +
      '</svg>';
  }

  var root = document.getElementById("app");

  function render() {
    var todayKey = fmtKey(new Date());
    var openCount = tasks.filter(function (t) { return !t.done && t.categoryId !== "notes"; }).length;
    var dueSoonAll = tasks.filter(function (t) {
      return !t.done && t.dueDate && new Date(t.dueDate) <= endOfToday();
    }).sort(function (a, b) { return new Date(a.dueDate) - new Date(b.dueDate); });
    var dueSoon = state.filter === "all" ? dueSoonAll : dueSoonAll.filter(function (t) { return t.categoryId === state.filter; });

    var html = '<div class="wrap">';

    var themeIcon = state.themeMode === "auto" ? "🌓" : (state.themeMode === "light" ? "☀️" : "🌙");
    html += '<div class="header">' +
      '<div class="brand"><div class="brand-bar"></div><div class="brand-name">Flow</div></div>' +
      '<div class="stats mono">' +
        '<button class="theme-btn" data-action="cycle-theme" title="Theme: ' + state.themeMode + '">' + themeIcon + '</button>' +
        '<span class="stat-pill">' + openCount + ' open</span>' +
        '<button class="bell' + (state.notifEnabled ? ' on' : '') + '" data-action="toggle-notif">🔔 ' + dueSoonAll.length + '</button>' +
      '</div></div>';

    var previewCat = state.inputValue.trim() ? CAT_BY_ID[categorize(state.inputValue)] : null;
    html += '<div class="quickadd-wrap"><div class="quickadd">' +
      '<span class="qa-plus">＋</span>' +
      '<input id="quick-input" type="text" placeholder="Type a task and press enter…" value="' + escapeHtml(state.inputValue) + '" />' +
      (previewCat ? '<span class="live-tag" style="background:' + previewCat.color + '25;color:' + previewCat.color + '">' + previewCat.short + '</span>' : '') +
      '</div><p class="hint">sorts itself as you type — tap a tag on any task to move it</p></div>';

    html += '<div class="chips">';
    html += '<button class="chip" data-action="set-filter" data-id="all" style="' + (state.filter === "all" ? "background:#4F46E5;color:#fff;border-color:transparent;" : "") + '">All <span class="mono">' + tasks.length + '</span></button>';
    CATEGORIES.forEach(function (cat) {
      var count = tasks.filter(function (t) { return t.categoryId === cat.id; }).length;
      var active = state.filter === cat.id;
      html += '<button class="chip" data-action="set-filter" data-id="' + cat.id + '" style="' + (active ? "background:" + cat.color + ";color:#0B0D12;border-color:transparent;" : "") + '">' + cat.short + ' <span class="mono">' + count + '</span></button>';
    });
    html += '</div>';

    if (dueSoon.length > 0) {
      html += '<div class="card"><div class="eyebrow">⏱ Due &amp; overdue</div><div class="tile-grid">';
      dueSoon.forEach(function (t) { html += renderTaskTile(t); });
      html += '</div></div>';
    }

    if (state.filter === "health") {
      html += renderHealthEssentials(todayKey, "healthtab");
      html += renderCalendarCard(todayKey);
      html += renderTaskList();
    } else if (state.filter === "all") {
      html += renderHealthEssentials(todayKey, "home");
      html += renderTaskList();
    } else if (state.filter === "notes") {
      html += renderNotesComposer();
      html += renderTaskList();
    } else {
      html += renderTaskList();
    }

    html += '</div>';
    root.innerHTML = html;
    attachInputHandlers();
  }

  function renderTaskTile(t) {
    var cat = CAT_BY_ID[t.categoryId];

    if (t.categoryId === "notes") {
      var editingNote = state.editingNoteId === t.id;
      var body = editingNote
        ? '<textarea class="note-edit-area" data-role="note-edit" data-id="' + t.id + '">' + escapeHtml(t.text) + '</textarea>'
        : '<p class="tile-text note-tap" data-action="edit-note" data-id="' + t.id + '" style="-webkit-line-clamp:6;">' + escapeHtml(t.text) + '</p>';
      return '<div class="tile note-tile" style="background:linear-gradient(160deg,' + cat.color + '14,' + cat.color + '05);">' +
        '<div class="tile-top"><span class="tile-cat-label mono" style="color:' + cat.color + '">NOTE</span>' +
        '<button class="tile-del" data-action="delete-task" data-id="' + t.id + '">✕</button></div>' +
        body +
        '<span class="tile-note-meta mono">' + new Date(t.createdAt).toLocaleDateString([], { month: "short", day: "numeric" }) + '</span>' +
      '</div>';
    }

    var editingCat = state.editState.type === "cat" && state.editState.id === t.id;
    var editingDue = state.editState.type === "due" && state.editState.id === t.id;
    var justDone = state.justCompletedId === t.id;

    var catEl;
    if (editingCat) {
      catEl = '<select class="select-tag" data-role="cat-select" data-id="' + t.id + '" style="font-size:9.5px;padding:2px 5px;">' +
        CATEGORIES.map(function (c) { return '<option value="' + c.id + '"' + (c.id === t.categoryId ? " selected" : "") + '>' + c.short + '</option>'; }).join("") +
      '</select>';
    } else {
      catEl = '<button class="tile-cat-label mono" data-action="start-edit-cat" data-id="' + t.id + '" style="color:' + cat.color + '">' + cat.short.toUpperCase() + '</button>';
    }

    var dueBadge;
    if (editingDue) {
      dueBadge = '<input type="datetime-local" class="due-input" data-role="due-input" data-id="' + t.id + '" value="' + (t.dueDate || "") + '" style="font-size:9.5px;padding:2px 5px;max-width:100%;" />';
    } else if (t.dueDate) {
      var meta = dueMeta(t.dueDate);
      var color = meta.overdue ? "#F87171" : "#4F46E5";
      var shortLabel = meta.overdue ? "Overdue" : meta.label.split(" · ")[0];
      dueBadge = '<button class="tile-due" data-action="start-edit-due" data-id="' + t.id + '" style="background:' + color + '22;color:' + color + '">⏱ ' + shortLabel + '</button>';
    } else {
      dueBadge = '<button class="tile-due" data-action="start-edit-due" data-id="' + t.id + '" style="background:var(--hairline);color:var(--dim);">+ remind</button>';
    }

    return '<div class="tile">' +
      '<div class="tile-top">' + catEl + '<button class="tile-del" data-action="delete-task" data-id="' + t.id + '">✕</button></div>' +
      '<p class="tile-text' + (t.done ? " done" : "") + '">' + escapeHtml(t.text) + '</p>' +
      '<div class="tile-footer">' +
        '<button class="check' + (t.done ? " done" : "") + (justDone ? " just-completed" : "") + '" data-action="toggle-done" data-id="' + t.id + '">' + (t.done ? "✓" : "") + '</button>' +
        dueBadge +
      '</div>' +
    '</div>';
  }

  function renderTaskRow(t) {
    var cat = CAT_BY_ID[t.categoryId];
    var editingCat = state.editState.type === "cat" && state.editState.id === t.id;
    var editingDue = state.editState.type === "due" && state.editState.id === t.id;
    var justDone = state.justCompletedId === t.id;

    var catEl;
    if (editingCat) {
      catEl = '<select class="select-tag" data-role="cat-select" data-id="' + t.id + '">' +
        CATEGORIES.map(function (c) { return '<option value="' + c.id + '"' + (c.id === t.categoryId ? " selected" : "") + '>' + c.short + '</option>'; }).join("") +
      '</select>';
    } else {
      catEl = '<button class="tag" data-action="start-edit-cat" data-id="' + t.id + '" style="background:' + cat.color + '25;color:' + cat.color + '">' + cat.short + '</button>';
    }

    var dueHtml;
    if (editingDue) {
      dueHtml = '<input type="datetime-local" class="due-input" data-role="due-input" data-id="' + t.id + '" value="' + (t.dueDate || "") + '" />';
    } else if (t.dueDate) {
      var meta = dueMeta(t.dueDate);
      var color = meta.overdue ? "#F87171" : "#4F46E5";
      var shortLabel = meta.overdue ? "Overdue · " + meta.label.split(" · ")[1] : meta.label;
      dueHtml = '<span style="display:inline-flex;align-items:center;gap:4px;">' +
        '<button class="tag" data-action="start-edit-due" data-id="' + t.id + '" style="background:' + color + '25;color:' + color + '">⏱ ' + shortLabel + '</button>' +
        '<button class="tile-del" data-action="clear-due" data-id="' + t.id + '">✕</button></span>';
    } else {
      dueHtml = '<button class="tag tag-ghost" data-action="start-edit-due" data-id="' + t.id + '" style="color:var(--dim);border:1px dashed var(--hairline-strong);background:none;">+ remind</button>';
    }

    return '<div class="row-item">' +
      '<button class="check' + (t.done ? " done" : "") + (justDone ? " just-completed" : "") + '" data-action="toggle-done" data-id="' + t.id + '">' + (t.done ? "✓" : "") + '</button>' +
      '<div class="row-body">' +
        '<p class="row-text' + (t.done ? " done" : "") + '">' + escapeHtml(t.text) + '</p>' +
        '<div class="tag-row">' + catEl + dueHtml + '</div>' +
      '</div>' +
      '<button class="tile-del" data-action="delete-task" data-id="' + t.id + '">✕</button>' +
    '</div>';
  }

  function renderTaskList() {
    function sortFn(a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return b.createdAt - a.createdAt;
    }

    if (state.filter === "all") {
      var groupsAll = CATEGORIES.map(function (cat) {
        return { cat: cat, items: tasks.filter(function (t) { return t.categoryId === cat.id; }).sort(sortFn) };
      }).filter(function (g) { return g.items.length > 0; });
      if (groupsAll.length === 0) {
        return '<div class="card"><p class="empty">Nothing here yet — type above to add your first one.</p></div>';
      }
      var listHtml = '<div class="card" style="padding-top:6px;padding-bottom:6px;">';
      groupsAll.forEach(function (g) {
        listHtml += '<div class="group-label" style="color:' + g.cat.color + '"><span class="dot"></span>' + g.cat.short + '</div>';
        g.items.forEach(function (t) { listHtml += renderTaskRow(t); });
      });
      listHtml += '</div>';
      return listHtml;
    }

    var items = tasks.filter(function (t) { return t.categoryId === state.filter; }).sort(sortFn);
    if (items.length === 0) {
      return '<div class="card"><p class="empty">Nothing here yet — type above to add your first one.</p></div>';
    }
    var gridHtml = '<div class="tile-grid">';
    items.forEach(function (t) { gridHtml += renderTaskTile(t); });
    gridHtml += '</div>';
    return gridHtml;
  }

  function renderNotesComposer() {
    return '<div class="card" style="margin-bottom:16px;">' +
      '<div class="eyebrow">📝 Add a note</div>' +
      '<textarea id="note-input" class="note-edit-area" placeholder="Write a note…"></textarea>' +
      '<div style="display:flex;justify-content:flex-end;margin-top:10px;">' +
        '<button id="note-add-btn" class="chip" style="background:#60A5FA;color:#0B0D12;border-color:transparent;">+ Add note</button>' +
      '</div>' +
    '</div>';
  }

  function currentStreak(todayKey) {
    var d = new Date();
    var streak = 0;
    var tLog = healthLogs[todayKey];
    if (tLog && scoreOf(tLog) === 0) return 0;
    if (!tLog) d.setDate(d.getDate() - 1);
    while (true) {
      var key = fmtKey(d);
      var log = healthLogs[key];
      if (!log || scoreOf(log) === 0) break;
      streak++;
      d.setDate(d.getDate() - 1);
    }
    return streak;
  }

  function renderHealthRows(dateKey) {
    var log = getHealthLog(dateKey);
    var rows = [
      { key: "eat", label: "Ate healthy", icon: "🍎" },
      { key: "supplements", label: "Supplements", icon: "💊" },
      { key: "gym", label: "Gym", icon: "🏋️" }
    ];
    var html = "";
    rows.forEach(function (r) {
      var active = log[r.key];
      html += '<div class="health-row"><span class="health-label">' + r.icon + ' ' + r.label + '</span>' +
        '<button class="check' + (active ? " done" : "") + '" data-action="health-toggle" data-date="' + dateKey + '" data-field="' + r.key + '">' + (active ? "✓" : "") + '</button></div>';
    });
    return html;
  }

  function renderHydrationCard(dateKey, idSuffix) {
    var log = getHealthLog(dateKey);
    var waterMl = log.waterMl || 0;
    var caffeineMl = log.caffeineMl || 0;
    var pct = Math.min(waterMl / WATER_GOAL_ML, 1);
    var r = 52, circ = 2 * Math.PI * r;
    var dash = circ * pct;
    var liters = (waterMl / 1000).toFixed(1);
    var goalLiters = (WATER_GOAL_ML / 1000).toFixed(0);
    var mg = Math.round(caffeineMl * CAFFEINE_MG_PER_ML);

    var html = '<div class="card">';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">' +
      '<div class="eyebrow" style="margin-bottom:0;">💧 Hydration</div>' +
      '<button class="tile-del" data-action="reset-hydration" data-date="' + dateKey + '" title="Reset">↺</button></div>';

    html += '<div style="display:flex;justify-content:center;position:relative;margin:8px 0 16px;">' +
      '<svg width="140" height="140" viewBox="0 0 120 120">' +
        '<defs><linearGradient id="ringGrad' + idSuffix + '" x1="0%" y1="0%" x2="100%" y2="100%">' +
          '<stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#4F46E5"/></linearGradient></defs>' +
        '<circle cx="60" cy="60" r="' + r + '" stroke="var(--ring-track)" stroke-width="10" fill="none"/>' +
        '<circle cx="60" cy="60" r="' + r + '" stroke="url(#ringGrad' + idSuffix + ')" stroke-width="10" fill="none" ' +
          'stroke-linecap="round" stroke-dasharray="' + circ.toFixed(1) + '" stroke-dashoffset="' + (circ - dash).toFixed(1) + '" transform="rotate(-90 60 60)"/>' +
      '</svg>' +
      '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;">' +
        '<div style="font-size:23px;font-weight:800;">' + liters + 'L</div>' +
        '<div class="mono" style="font-size:10px;color:var(--muted);">of ' + goalLiters + 'L</div>' +
      '</div></div>';

    html += '<div class="cutout-row">' +
      '<button class="cutout-btn" data-action="add-water" data-date="' + dateKey + '" data-amount="600">' + iconBottleSmall(idSuffix) + '<span class="cutout-label">Small</span><span class="cutout-sub mono">600ml</span></button>' +
      '<button class="cutout-btn" data-action="add-water" data-date="' + dateKey + '" data-amount="1500">' + iconBottleBig(idSuffix) + '<span class="cutout-label">Big</span><span class="cutout-sub mono">1.5L</span></button>' +
      '<button class="cutout-btn" data-action="add-coffee" data-date="' + dateKey + '" data-amount="240">' + iconCoffeeCup(idSuffix) + '<span class="cutout-label">Americano</span><span class="cutout-sub mono">240ml</span></button>' +
    '</div>';

    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--hairline);">' +
      '<span style="font-size:12px;color:var(--muted);">☕ Caffeine today</span>' +
      '<span class="mono" style="font-size:13px;font-weight:700;">' + caffeineMl + 'ml <span style="color:var(--dim);font-weight:400;">(~' + mg + 'mg)</span></span>' +
    '</div>';

    html += '</div>';
    return html;
  }

  function renderHealthEssentials(todayKey, idSuffix) {
    var streak = currentStreak(todayKey);
    var days = [];
    var d0 = new Date();
    for (var i = 20; i >= 0; i--) {
      var day = new Date(d0); day.setDate(d0.getDate() - i);
      days.push(fmtKey(day));
    }
    var html = '<div class="card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">' +
      '<span style="font-size:18px;">🔥</span>' +
      '<span style="font-size:14px;font-weight:700;">' + (streak > 0 ? streak + " day streak" : "Log today to start a streak") + '</span>' +
      '</div><div class="streak-row">';
    days.forEach(function (key) {
      var score = scoreOf(healthLogs[key]);
      var color = statusHex(score);
      var isToday = key === todayKey;
      html += '<div class="streak-bar" style="background:' + (color || "var(--tile-empty)") + ';' + (isToday ? "border:2px solid var(--text);box-shadow:0 0 10px rgba(79,70,229,0.35);" : "") + '" title="' + key + '"></div>';
    });
    html += '</div></div>';

    html += renderHydrationCard(todayKey, idSuffix);
    html += '<div class="card"><div class="eyebrow">Today</div>' + renderHealthRows(todayKey) + '</div>';
    return html;
  }

  function renderCalendarCard(todayKey) {
    var year = state.calendarMonth.getFullYear();
    var month = state.calendarMonth.getMonth();
    var firstWeekday = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var monthLabel = state.calendarMonth.toLocaleDateString([], { month: "long", year: "numeric" });
    var endOfTodayD = new Date(); endOfTodayD.setHours(23, 59, 59, 999);

    var html = '<div class="card"><div class="cal-head">' +
      '<button class="cal-nav" data-action="cal-prev">‹</button>' +
      '<span class="cal-month mono">' + monthLabel + '</span>' +
      '<button class="cal-nav" data-action="cal-next">›</button></div>' +
      '<div class="cal-grid" style="margin-bottom:6px;">' +
      ["S","M","T","W","T","F","S"].map(function (d) { return '<div class="cal-dow mono">' + d + '</div>'; }).join("") +
      '</div><div class="cal-grid">';
    for (var b = 0; b < firstWeekday; b++) { html += '<div></div>'; }
    for (var day2 = 1; day2 <= daysInMonth; day2++) {
      var dateObj = new Date(year, month, day2);
      var dateKey = fmtKey(dateObj);
      var score2 = scoreOf(healthLogs[dateKey]);
      var color2 = statusHex(score2);
      var isToday2 = dateKey === todayKey;
      var isFuture = dateObj > endOfTodayD;
      html += '<button class="cal-day mono' + (isToday2 ? " today" : "") + (isFuture ? " future" : "") + '"' +
        (isFuture ? " disabled" : "") + ' data-action="cal-day" data-date="' + dateKey + '" style="' +
        (color2 ? "background:" + color2 + "33;color:" + color2 + ";" : "") + '">' + day2 + '</button>';
    }
    html += '</div>';

    if (state.editingHealthDate) {
      var label = new Date(state.editingHealthDate).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
      html += '<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--hairline-strong);">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">' +
        '<span class="mono" style="font-size:12px;color:var(--muted);">' + label + '</span>' +
        '<button class="tile-del" data-action="close-health-edit">✕</button></div>';
      html += renderHydrationCard(state.editingHealthDate, "caledit");
      html += '<div style="margin-top:12px;">' + renderHealthRows(state.editingHealthDate) + '</div>';
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  document.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var action = btn.dataset.action;
    var id = btn.dataset.id;

    if (action === "set-filter") { state.filter = id; state.editingHealthDate = null; render(); }
    else if (action === "toggle-done") {
      var target = tasks.filter(function (x) { return x.id === id; })[0];
      var wasDone = target ? target.done : false;
      tasks = tasks.map(function (t) { return t.id === id ? Object.assign({}, t, { done: !t.done }) : t; });
      persistTasks();
      if (!wasDone) {
        state.justCompletedId = id;
        render();
        setTimeout(function () { if (state.justCompletedId === id) { state.justCompletedId = null; } }, 550);
      } else {
        state.justCompletedId = null;
        render();
      }
    }
    else if (action === "delete-task") {
      tasks = tasks.filter(function (t) { return t.id !== id; });
      persistTasks(); render();
    }
    else if (action === "start-edit-cat") { state.editState = { type: "cat", id: id }; render(); }
    else if (action === "start-edit-due") { state.editState = { type: "due", id: id }; render(); }
    else if (action === "clear-due") {
      tasks = tasks.map(function (t) { return t.id === id ? Object.assign({}, t, { dueDate: null }) : t; });
      persistTasks(); render();
    }
    else if (action === "toggle-notif") { toggleNotif(); }
    else if (action === "cycle-theme") { cycleTheme(); }
    else if (action === "edit-note") { state.editingNoteId = id; render(); }
    else if (action === "health-toggle") {
      var dateKey = btn.dataset.date, field = btn.dataset.field;
      var log = getHealthLog(dateKey);
      var updated = Object.assign({}, log); updated[field] = !log[field];
      healthLogs = Object.assign({}, healthLogs); healthLogs[dateKey] = updated;
      persistHealth(); render();
    }
    else if (action === "add-water") {
      var dk1 = btn.dataset.date, amt1 = parseInt(btn.dataset.amount, 10);
      var lg1 = getHealthLog(dk1);
      healthLogs = Object.assign({}, healthLogs);
      healthLogs[dk1] = Object.assign({}, lg1, { waterMl: (lg1.waterMl || 0) + amt1 });
      persistHealth(); render();
    }
    else if (action === "add-coffee") {
      var dk2 = btn.dataset.date, amt2 = parseInt(btn.dataset.amount, 10);
      var lg2 = getHealthLog(dk2);
      healthLogs = Object.assign({}, healthLogs);
      healthLogs[dk2] = Object.assign({}, lg2, { waterMl: (lg2.waterMl || 0) + amt2, caffeineMl: (lg2.caffeineMl || 0) + amt2 });
      persistHealth(); render();
    }
    else if (action === "reset-hydration") {
      var dk3 = btn.dataset.date;
      if (confirm("Reset today's water and caffeine to 0?")) {
        healthLogs = Object.assign({}, healthLogs);
        healthLogs[dk3] = Object.assign({}, getHealthLog(dk3), { waterMl: 0, caffeineMl: 0 });
        persistHealth(); render();
      }
    }
    else if (action === "cal-prev") {
      state.calendarMonth = new Date(state.calendarMonth.getFullYear(), state.calendarMonth.getMonth() - 1, 1);
      render();
    }
    else if (action === "cal-next") {
      state.calendarMonth = new Date(state.calendarMonth.getFullYear(), state.calendarMonth.getMonth() + 1, 1);
      render();
    }
    else if (action === "cal-day") { state.editingHealthDate = btn.dataset.date; render(); }
    else if (action === "close-health-edit") { state.editingHealthDate = null; render(); }
  });

  document.addEventListener("change", function (e) {
    if (e.target.matches('[data-role="cat-select"]')) {
      var id1 = e.target.dataset.id;
      tasks = tasks.map(function (t) { return t.id === id1 ? Object.assign({}, t, { categoryId: e.target.value }) : t; });
      persistTasks();
      state.editState = { type: null, id: null };
      render();
    } else if (e.target.matches('[data-role="due-input"]')) {
      var id2 = e.target.dataset.id;
      tasks = tasks.map(function (t) { return t.id === id2 ? Object.assign({}, t, { dueDate: e.target.value }) : t; });
      persistTasks();
      state.editState = { type: null, id: null };
      render();
    }
  });

  document.addEventListener("focusout", function (e) {
    if (e.target.matches('[data-role="cat-select"], [data-role="due-input"]')) {
      setTimeout(function () {
        if (state.editState.type) { state.editState = { type: null, id: null }; render(); }
      }, 150);
    }
  });

  function attachInputHandlers() {
    var input = document.getElementById("quick-input");
    if (input) {
      input.addEventListener("input", function (e) {
        state.inputValue = e.target.value;
        render();
        var el = document.getElementById("quick-input");
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          var text = state.inputValue.trim();
          if (!text) return;
          var newTask = { id: makeId(), text: text, categoryId: categorize(text), dueDate: null, done: false, createdAt: Date.now() };
          tasks = [newTask].concat(tasks);
          persistTasks();
          state.inputValue = "";
          render();
          var el2 = document.getElementById("quick-input");
          if (el2) el2.focus();
        }
      });
    }

    var noteInput = document.getElementById("note-input");
    if (noteInput) {
      var addBtn = document.getElementById("note-add-btn");
      if (addBtn) {
        addBtn.addEventListener("click", function () {
          var text = noteInput.value.trim();
          if (!text) return;
          var newNote = { id: makeId(), text: text, categoryId: "notes", dueDate: null, done: false, createdAt: Date.now() };
          tasks = [newNote].concat(tasks);
          persistTasks();
          render();
        });
      }
    }

    var noteEditArea = document.querySelector('[data-role="note-edit"]');
    if (noteEditArea) {
      noteEditArea.focus();
      noteEditArea.setSelectionRange(noteEditArea.value.length, noteEditArea.value.length);
      noteEditArea.addEventListener("blur", function () {
        var id = noteEditArea.dataset.id;
        var newText = noteEditArea.value.trim();
        tasks = tasks.map(function (t) {
          if (t.id !== id) return t;
          return newText ? Object.assign({}, t, { text: newText }) : t;
        });
        if (!newText) {
          // an emptied note gets removed rather than left blank
          tasks = tasks.filter(function (t) { return t.id !== id; });
        }
        persistTasks();
        state.editingNoteId = null;
        render();
      });
    }
  }

  function tasksForServer() {
    return tasks.map(function (t) {
      return Object.assign({}, t, {
        dueDateUTC: t.dueDate ? new Date(t.dueDate).toISOString() : null
      });
    });
  }

  function urlBase64ToUint8Array(base64String) {
    var padding = "=".repeat((4 - (base64String.length % 4)) % 4);
    var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    var rawData = atob(base64);
    var outputArray = new Uint8Array(rawData.length);
    for (var i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  function syncTasksToServer() {
    if (!state.notifEnabled || !("serviceWorker" in navigator)) return;
    navigator.serviceWorker.ready.then(function (reg) {
      reg.pushManager.getSubscription().then(function (sub) {
        if (!sub) return;
        fetch(API_BASE + "/api/subscribe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tasks: tasksForServer() })
        }).catch(function () {});
      });
    });
  }

  function subscribePush() {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
    navigator.serviceWorker.ready.then(function (reg) {
      reg.pushManager.getSubscription().then(function (existing) {
        var p = existing ? Promise.resolve(existing) : reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
        p.then(function (sub) {
          fetch(API_BASE + "/api/subscribe", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ subscription: sub, tasks: tasksForServer() })
          }).catch(function () {});
        }).catch(function (e) { console.error("push subscribe failed", e); });
      });
    });
  }

  function toggleNotif() {
    if (!state.notifEnabled) {
      if ("Notification" in window) {
        if (Notification.permission === "denied") {
          alert("Notifications are blocked for Flow at the system level. Long-press the Flow app icon → app info (ⓘ) → Notifications → turn it on, then tap the bell again.");
          return;
        }
        Notification.requestPermission().then(function (perm) {
          if (perm === "granted") {
            state.notifEnabled = true; save(STORAGE_NOTIF, true); render(); checkDueReminders();
            subscribePush();
          } else if (perm === "denied") {
            alert("Notifications were just blocked. Long-press the Flow app icon → app info (ⓘ) → Notifications → turn it on, then tap the bell again.");
          }
        });
      } else {
        alert("This browser doesn't support notifications.");
      }
    } else {
      state.notifEnabled = false; save(STORAGE_NOTIF, false); render();
    }
  }

  function checkDueReminders() {
    // Local fallback removed — this previously fired a notification directly
    // from the page, which only works while the app is open and was masking
    // whether real background push is actually functioning. Real due-reminder
    // delivery now happens exclusively via the server push pipeline.
  }

  setInterval(checkDueReminders, 15000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { checkDueReminders(); applyTheme(); }
  });

  render();
  checkDueReminders();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").catch(function () {});
  }
})();
</script>
</body>
</html>
